header:
  version: 10

target: core-image-minimal

local_conf_header:
  bbb: |
    MACHINE = "beaglebone-yocto"
    CORE_IMAGE_EXTRA_INSTALL:append = " microblx-latest microblx-latest-dbg microblx-latest-doc"

    PACKAGECONFIG:append:pn-microblx-latest = " BLOCK_LSDB_INTF BLOCK_WEBGRAPH"
    PACKAGECONFIG:append:pn-microblx-devel  = " BLOCK_LSDB_INTF BLOCK_WEBGRAPH"

    # run the microblx lua tests as ptests ('ptest-runner microblx-latest').
    # Only these are installed, deliberately not IMAGE_FEATURES
    # 'ptest-pkgs', which would pull in every ptest package.
    DISTRO_FEATURES:append = " ptest"
    CORE_IMAGE_EXTRA_INSTALL:append = " ptest-runner microblx-latest-ptest"

repos:
  meta/meta-microblx:
    url: "git@github.com:kmarkus/meta-microblx"
    refspec: "dev"

  meta/poky:
    url: "git://git.yoctoproject.org/poky"
    refspec: "scarthgap"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta/meta-openembedded:
    url: "git://git.openembedded.org/meta-openembedded"
    refspec: "scarthgap"
    layers:
      meta-oe:
      meta-webserver:
