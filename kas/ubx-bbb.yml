header:
  version: 10

target: core-image-minimal

local_conf_header:
  bbb: |
    MACHINE = "beaglebone-yocto"
    DISTRO = "poky"

    CORE_IMAGE_EXTRA_INSTALL:append = " microblx-latest microblx-latest-dbg microblx-latest-doc"

    # Demo the full applicable microblx feature set. The recipe default already
    # enables BLOCK_WEBGRAPH, UBX_LOG_DAEMON and ENABLE_URCU (hot connect); add
    # the lsdbus interface block and SDT/USDT probe tracing, and drop
    # USE_LFDS_611 -- the lfds_cyclic block it builds is deprecated, use lfrb
    # instead.
    # The remaining PACKAGECONFIGs don't apply to this target:
    #   USE_TIMESRC_TSC    -- x86 only
    #   USE_TIMESRC_CNTVCT -- needs the ARM generic timer; Cortex-A8 has none
    #   TRACING_MARKER     -- mutually exclusive with TRACING_SDT
    PACKAGECONFIG:remove:pn-microblx-latest = " USE_LFDS_611"
    PACKAGECONFIG:remove:pn-microblx-devel  = " USE_LFDS_611"
    PACKAGECONFIG:append:pn-microblx-latest = " BLOCK_LSDB_INTF BLOCK_WEBGRAPH TRACING_SDT"
    PACKAGECONFIG:append:pn-microblx-devel  = " BLOCK_LSDB_INTF BLOCK_WEBGRAPH TRACING_SDT"

    # run the microblx lua tests as ptests ('ptest-runner microblx-latest').
    # Only these are installed, deliberately not IMAGE_FEATURES 'ptest-pkgs',
    # which would pull in every ptest package.
    DISTRO_FEATURES:append = " ptest"
    CORE_IMAGE_EXTRA_INSTALL:append = " ptest-runner microblx-latest-ptest"

repos:
  meta/meta-microblx:
    url: "git@github.com:kmarkus/meta-microblx"
    refspec: "dev"

  meta/poky:
    url: "git://git.yoctoproject.org/poky"
    refspec: "scarthgap"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta/meta-openembedded:
    url: "git://git.openembedded.org/meta-openembedded"
    refspec: "scarthgap"
    layers:
      meta-oe:
      meta-webserver:
