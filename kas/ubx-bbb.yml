header:
  version: 10

target: core-image-minimal

local_conf_header:
  bbb: |
    MACHINE = "beaglebone-yocto"
    CORE_IMAGE_EXTRA_INSTALL:append = " microblx-latest microblx-latest-dbg microblx-latest-doc"

    PACKAGECONFIG:pn-microblx-latest += "BLOCK_LSDB_INTF BLOCK_WEBGRAPH"
    PACKAGECONFIG:pn-microblx-devel += "BLOCK_LSDB_INTF BLOCK_WEBGRAPH"

repos:
  meta/meta-microblx:
    url: "git@github.com:kmarkus/meta-microblx"
    refspec: "dev"

  meta/poky:
    url: "git://git.yoctoproject.org/poky"
    refspec: "scarthgap"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta/meta-openembedded:
    url: "git://git.openembedded.org/meta-openembedded"
    refspec: "scarthgap"
    layers:
      meta-oe:
      meta-webserver:
